<form [formGroup]="form" (ngSubmit)="onSubmit()" class="max-w-lg mx-auto p-6 bg-white rounded-lg shadow-md dark:bg-gray-800">
  <div class="mb-4">
    <label for="nom" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Votre nom</label>
    <input id="nom" type="text" formControlName="nom" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
    @if (nomErrors()) {
      <span class="error">{{ nomErrors() }}</span>
    }  
  </div>
  <div class="mb-4">
    <label for="prenom" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Votre prénom</label>
    <input id="prenom" type="text" formControlName="prenom" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
    @if (prenomErrors()) {
      <span class="error">{{ prenomErrors() }}</span>
    }  
  </div>
  <div class="mb-4">
    <label for="dateNaissance" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Votre date de naissance</label>
    <input id="dateNaissance" type="date" formControlName="dateNaissance" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
    @if (dateNaissanceErrors()) {
      <span class="error">{{ dateNaissanceErrors() }}</span>
    }  
  </div>
  <div class="mb-4">
    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Votre email</label>
    <input id="email" type="email" formControlName="email" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
    @if (emailErrors()) {
      <span class="error">{{ emailErrors() }}</span>
    }  
  </div>
  <div class="mb-4">
    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Votre mot de passe</label>
    <input id="password" type="password" formControlName="password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
    @if (passwordErrors()) {
      <span class="error">{{ passwordErrors() }}</span>
    }  
  </div>
  <div class="mb-4">
    <label for="password2" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirmez votre mot de passe</label>
    <input id="password2" type="password" formControlName="password2" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
    @if (password2Errors()) {
      <span class="error">{{ password2Errors() }}</span>
    }  
  </div>

  <button type="submit" [disabled]="!form.valid" class="w-full px-4 py-2 text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50">
    S'inscrire
  </button>
</form>
